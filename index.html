<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Bull Ranker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥫</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header class="wrap top">
    <h1><span class="mark">RB</span>Red Bull Ranker</h1>
    <button class="btn primary" id="addBtn">+ Add a Red Bull</button>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="panel-head">
        <h2 class="eyebrow">My ranking</h2>
        <label class="sort"><span class="muted">sort by</span>
          <select id="sortSel">
            <option value="score">score</option>
            <option value="added">recently added</option>
            <option value="name">name</option>
          </select>
        </label>
      </div>

      <ol id="list" class="list"></ol>

      <div id="empty" class="empty" hidden>
        <div class="empty-cans" id="emptyCans"></div>
        <p>No Red Bulls ranked yet. Add the first can and give it a score from 1 to 10.</p>
        <button class="btn" id="emptyAdd">+ Add a Red Bull</button>
      </div>

      <div class="toolbar">
        <button class="btn" id="exportBtn">Export</button>
        <label class="btn">Import<input type="file" id="importInput" accept="application/json" hidden></label>
      </div>
    </section>
  </main>

  <!-- Add dialog -->
  <dialog id="addDlg" class="dlg">
    <div class="dlg-head">
      <h2 class="eyebrow">Add a Red Bull</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <input id="search" class="search" type="search" placeholder="Search editions: watermelon, winter, pistachio…" autocomplete="off">
    <div id="chips" class="chips"></div>
    <div id="grid" class="grid"></div>
    <details class="custom">
      <summary>Can't find it? Add your own</summary>
      <form id="customForm" class="custom-form">
        <input name="name" placeholder="Name (e.g. Summer Edition 2027)" required>
        <input name="flavor" placeholder="Flavor">
        <label class="color">Can color <input type="color" name="color" value="#1e3a8a"></label>
        <button class="btn primary" type="submit">Add</button>
      </form>
    </details>
  </dialog>

  <!-- Image dialog -->
  <dialog id="imgDlg" class="dlg small">
    <div class="dlg-head">
      <h2 class="eyebrow">Change picture</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <form id="imgForm" class="img-form">
      <label>Image URL <input name="url" type="url" placeholder="https://…"></label>
      <div class="or">or</div>
      <label class="btn file">Upload a photo<input name="file" type="file" accept="image/*" hidden></label>
      <div class="img-actions">
        <button type="button" class="btn" id="imgReset">Use drawn can</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="editions.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
